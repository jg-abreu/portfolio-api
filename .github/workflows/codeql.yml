name: CodeQL V2

on:
  push:
    branches: [feat/v2]
    paths:
      - src/**
      - pom.xml
      - .mvn/**
      - mvnw
      - mvnw.cmd
      - .github/workflows/codeql.yml
  pull_request:
    branches: [feat/v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - run: bash ./mvnw -B -DskipTests compile
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907
        with:
          category: /language:java-kotlin
