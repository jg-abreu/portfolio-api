name: portfolio-production

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: eclipse-temurin:21-jre
    profiles: [api]
    restart: unless-stopped
    user: "10001:10001"
    working_dir: /app
    command: ["java", "-XX:MaxRAMPercentage=60.0", "-jar", "/app/portfolio-api.jar"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio
      SPRING_DATASOURCE_USERNAME: portfolio
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      PORTFOLIO_ADMIN_UI_URL: ${ADMIN_UI_URL:-https://v2.joaoabreu.dev/en/admin/}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-https://v2.joaoabreu.dev/login/oauth2/code/github}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORTFOLIO_RECOMMENDATIONS_MEDIA_DIR: /data/recommendations
      PORTFOLIO_PROFILE_CARD_ENABLED: ${PROFILE_CARD_ENABLED:-false}
      PORTFOLIO_PROFILE_CARD_GITHUB_TOKEN: ${PROFILE_CARD_GITHUB_TOKEN:-}
    volumes:
      - type: bind
        source: ./portfolio-api.jar
        target: /app/portfolio-api.jar
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./recommendations
        target: /data/recommendations
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
