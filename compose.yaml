# Local development database. Spring Boot starts it on its own (spring-boot-docker-compose).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    # 15432 on the host: 5432 and 5433 are often taken by a locally installed PostgreSQL.
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
